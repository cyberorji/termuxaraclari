<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Cyber terminal banner">
  <defs>
    <filter id="crtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#18e6ff" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#18e6ff" flood-opacity="0.75"/>
    </filter>
    <filter id="menuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#41f9ff" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#41f9ff" flood-opacity="0.7"/>
    </filter>
    <filter id="scanlines" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#3c3ccf" opacity="0.9"/>
      <circle cx="12" cy="10" r="1.5" fill="#3c3ccf" opacity="0.9"/>
      <circle cx="8" cy="14" r="1.2" fill="#3c3ccf" opacity="0.8"/>
    </pattern>
    <clipPath id="leftBlobClip">
      <path d="M 15 10 L 235 10 L 270 80 L 290 210 L 255 410 L 205 575 L 120 760 L 40 900 L 0 900 L 0 20 Z"/>
    </clipPath>
    <style>
      .cyber-title {
        fill: #dfeaf8;
        font-family: "Courier New", monospace;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .text-plain {
        fill: #d7d7d7;
        font-family: "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
      }
      .label { fill: #d7d7d7; font-family: "Courier New", monospace; font-size: 20px; font-weight: 700; }
      .menu {
        fill: rgba(10, 12, 14, 0.60);
        stroke: #2ce0f3;
        stroke-width: 3;
      }
      .menu-head {
        fill: rgba(8, 18, 24, 0.9);
        stroke: #2ce0f3;
        stroke-width: 3;
      }
      .cyan { fill: #2ce0f3; }
      .green { fill: #1efc8f; }
      .red { fill: #ff4d4d; }
      .purple { fill: #8b72ff; }
      .soft { fill: #b7c8d9; }
      .white { fill: #f4f4f4; }
      .dim { fill: #d7d7d7; }
      .cursor { fill: #d9d9d9; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#000000"/>
  <rect width="1600" height="900" fill="#000000" filter="url(#scanlines)" opacity="0.14"/>

  <g clip-path="url(#leftBlobClip)">
    <rect x="0" y="0" width="420" height="900" fill="url(#dotGrid)" opacity="0.95"/>
  </g>

  <g opacity="0.7">
    <path d="M 300 20 L 475 210 L 360 335 L 540 460" fill="none" stroke="#0b0d1a" stroke-width="2"/>
    <path d="M 340 0 L 450 150 L 360 330 L 630 470" fill="none" stroke="#0b0d1a" stroke-width="2"/>
  </g>

  <g filter="url(#crtGlow)">
    <text x="90" y="245" class="cyber-title" font-size="140" transform="scale(1.0 0.92)">CYBER</text>
  </g>

  <g font-family="Courier New, monospace" font-weight="700">
    <line x1="90" y1="705" x2="175" y2="705" stroke="#cfeaf7" stroke-width="2" opacity="0.85"/>
    <line x1="100" y1="675" x2="160" y2="675" stroke="#cfeaf7" stroke-width="2" opacity="0.7"/>
    <line x1="110" y1="645" x2="145" y2="645" stroke="#cfeaf7" stroke-width="2" opacity="0.7"/>
    <line x1="120" y1="615" x2="140" y2="615" stroke="#cfeaf7" stroke-width="2" opacity="0.6"/>
  </g>

  <g transform="translate(440 88)">
    <path d="M 0 0 L 310 245" fill="none" stroke="#2ae17e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="0.9"/>
    <path d="M 0 0 L 240 190" fill="none" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="0.9"/>
    <path d="M 0 0 L 380 270" fill="none" stroke="#2ae17e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="0.8"/>

    <g font-family="Courier New, monospace" font-size="18" font-weight="700">
      <text x="150" y="20" fill="#f0f7ff">0000</text>
      <text x="168" y="42" fill="#f0f7ff">0000</text>
      <text x="190" y="65" fill="#f0f7ff">000000</text>
      <text x="220" y="90" fill="#f0f7ff">000000</text>
      <text x="260" y="120" fill="#ff4d4d">D0000</text>
      <text x="290" y="148" fill="#ff4d4d">D000</text>
      <text x="315" y="168" fill="#ff4d4d">D00</text>
      <text x="335" y="192" fill="#ff4d4d">D0</text>

      <text x="72" y="94" fill="#1efc8f">#</text>
      <text x="86" y="112" fill="#1efc8f">##</text>
      <text x="100" y="130" fill="#1efc8f">###</text>
      <text x="116" y="150" fill="#1efc8f">###</text>
      <text x="132" y="170" fill="#1efc8f">###</text>
      <text x="150" y="188" fill="#1efc8f">#</text>
      <text x="130" y="238" fill="#1efc8f">###</text>
      <text x="102" y="265" fill="#1efc8f">##</text>
      <text x="80" y="292" fill="#1efc8f">#</text>
    </g>
  </g>

  <g transform="translate(0,0)" font-family="Courier New, monospace" font-weight="700">
    <text x="428" y="322" fill="#fefefe" font-size="54">Kurucu:</text>
    <text x="646" y="322" fill="#3ee4ff" font-size="54">CYBER</text>
  </g>

  <g transform="translate(0,0)" filter="url(#menuGlow)">
    <rect x="377" y="410" width="930" height="255" class="menu" rx="0"/>
    <rect x="377" y="410" width="930" height="42" class="menu-head"/>
    <text x="840" y="440" class="text-plain" fill="#d7d7d7" text-anchor="middle" style="font-size: 28px;">CYBER ANA MENÜ</text>

    <g class="text-plain" style="font-size: 23px;">
      <text x="410" y="494" fill="#85f1ff">[1]</text>
      <text x="470" y="494" fill="#ffffff">IP SORGU</text>
      <text x="660" y="494" fill="#65dafb">→</text>
      <text x="700" y="494" fill="#d7d7d7">Konum, ISP, DNS, cihaz, proxy</text>

      <text x="410" y="544" fill="#85f1ff">[2]</text>
      <text x="470" y="544" fill="#ffffff">DOS SALDIRISI</text>
      <text x="660" y="544" fill="#65dafb">→</text>
      <text x="700" y="544" fill="#d7d7d7">600 thread, GET/POST/HEAD, süreli</text>

      <text x="410" y="594" fill="#85f1ff">[3]</text>
      <text x="470" y="594" fill="#ffffff">WEB ANALIZ</text>
      <text x="660" y="594" fill="#65dafb">→</text>
      <text x="700" y="594" fill="#d7d7d7">index, admin, DNS, açık dosyalar</text>

      <text x="410" y="644" fill="#85f1ff">[4]</text>
      <text x="470" y="644" fill="#ffffff">SMS BOMBER</text>
      <text x="660" y="644" fill="#65dafb">→</text>
      <text x="700" y="644" fill="#d7d7d7">Normal / Turbo, 90+ Türk servis</text>

      <text x="410" y="694" fill="#ff5555">[0]</text>
      <text x="470" y="694" fill="#ffffff">ÇIKIŞ</text>
    </g>

    <rect x="377" y="410" width="930" height="255" fill="none" stroke="#2ce0f3" stroke-width="3"/>
  </g>

  <g class="text-plain" fill="#d7d7d7">
    <text x="400" y="745">Seçim</text>
    <text x="510" y="745" fill="#7dffea">&gt;</text>
    <rect x="550" y="732" width="26" height="18" fill="#d9d9d9"/>
  </g>
</svg>
